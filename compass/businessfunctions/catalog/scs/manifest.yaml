# Supply Chain Services.
#
# The function that buys and distributes things on the firm's behalf — and so
# the function that has to be able to say who received what.

id: scs
name: SCS
subtitle: Supply Chain Services
blurb: >-
  Procurement and distribution. RewardLens is the one place a gift, award or
  voucher given to an employee is recorded, so the firm can answer who
  received what and how much it came to; Gift oversight is the same facts
  read from above, for the people accountable for them.
owner: scs-function-owner

starters:
  - Who is over the gift limit this year?
  - What has nobody acknowledged yet?

tools:
  - read_rows
  - explain_row

features:
  - id: oversight
    name: Gift oversight
    short: Exposure · process health
    blurb: >-
      What the firm is exposed to, how much of it nobody has decided, and
      where the process has stopped. Built from the same rows RewardLens
      shows, so the two cannot disagree.
    handler: gift_oversight
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      Exposure is a figure for one year. Picking the year is what makes it
      a number rather than a pile.

    # No `self` and no `team`: an aggregate of one person is not a
    # dashboard, and "what is the firm exposed to" is not a question an
    # individual's own record can answer. Everybody else is told why rather
    # than shown an empty screen.
    visibility:
      firm: [compliance, finance, audit, leadership]

    # No actions, deliberately. This screen reports; the decisions belong
    # to the people whose names go against them, on RewardLens. A feature
    # with no actions also tells the assistant it cannot operate here, so
    # the rail answers questions and never proposes anything.

    rules:
      - id: oversight_is_a_role
        headline: This one is for compliance.
        detail: >-
          It names people and what they received across the whole firm, so
          it is shown to the compliance role. That the screen exists is not
          the secret; what is on it is.
        tone: limit
      - id: somebody_never_heard
        headline: A question never reached the person it was about.
        detail: >-
          The record says it was asked and the email did not go. Nobody is
          waiting on them, because they do not know they were asked — which
          is the quietest way for this to fail.
        tone: limit
      - id: the_process_has_stalled
        headline: Something has been waiting too long.
        detail: >-
          Not a breach — a process that stopped. Whoever was supposed to
          answer or acknowledge has not, and no amount of chasing the
          totals will fix that.
        tone: limit
      - id: nothing_outstanding
        headline: Nothing is waiting on anybody.
        detail: >-
          Every breach has been decided and every question answered. Worth
          saying out loud: a dashboard that only speaks when things are
          wrong is one people learn to ignore.
        tone: notice

    starters:
      - What are we exposed to?
      - What has nobody decided?
      - Where has the process stopped?

    tools:
      - read_rows
      - explain_row

  - id: audit
    name: Audit trail
    short: Every decision, in order
    blurb: >-
      Not a position but a history: one row per thing that happened, with a
      name and a time against it. The question this answers is whether
      every gift and every approval can be shown to have happened, which no
      summary can.
    handler: gift_audit
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The trail is kept per year, like everything else that hangs off an
      annual limit.

    # No actions at all. A function that could alter what it audits is not
    # one — and Audit, which can see everything, is the persona most likely
    # to be over-granted by somebody being helpful.

    visibility:
      firm: [audit, compliance, finance, leadership]

    rules:
      - id: audit_is_a_role
        headline: This one is for Audit.
        detail: >-
          It shows every decision anybody has taken about anybody's gifts,
          which is more than most people have any reason to read.
        tone: limit
      - id: nothing_has_happened
        headline: Nothing has been recorded yet.
        detail: >-
          No gift has been requested, reviewed or declared in this year. An
          empty trail is a true answer, not a broken screen.
        tone: notice

    starters:
      - What happened most recently?
      - Which decisions has anybody taken?

    tools:
      - read_rows
      - explain_row

  - id: finance
    name: Tax & budget
    short: Referrals · thresholds · spend
    blurb: >-
      What compliance has sent to Finance, who is past the annual limit and
      by how much, and what each team has committed against its budget. The
      amount above the limit is reported; the tax treatment is Finance's own
      system's to decide.
    handler: gift_finance
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      A limit is annual and so is a budget. Without the year, neither
      question has an answer.

    visibility:
      firm: [finance, compliance, audit, leadership]

    actions:
      - id: record_tax
        label: Record the treatment
        roles: [finance]
        note_label: What did Finance do with it?
        confirm: >-
          Records that Finance has dealt with this referral, with your note
          on the trail. It does not change the total — a total is the sum of
          what somebody received, and no department edits that.
        reversible: false

    rules:
      - id: finance_is_a_role
        headline: This one is for Finance.
        detail: >-
          It names everybody past the annual limit across the firm, which is
          not something an individual needs to read.
        tone: limit
      - id: not_everything_was_referred
        headline: Somebody is past the limit and was never referred.
        detail: >-
          Finance hearing only about the breaches compliance remembered to
          send is the shape of the problem this function exists to end, so
          the list here is everybody — referred or not.
        tone: limit
      - id: a_team_is_over_budget
        headline: A team has committed more than it was given.
        detail: >-
          Committed, not spent: an approval commits the money and handing it
          over spends it. The gap is where a budget holder still has a
          choice.
        tone: limit
      - id: nothing_above_the_limit
        headline: Nobody is past the limit.
        detail: Worth saying plainly, so the screen is read when it is not.
        tone: notice

    starters:
      - Who is past the limit?
      - What has been referred to Finance?
      - Which teams are near their budget?

    tools:
      - read_rows
      - explain_row

  - id: requests
    name: Gift requests
    short: Ask · check · approve
    blurb: >-
      Asking before giving, with the three answers in front of whoever
      approves: whether it is permitted, what it does to the recipient's
      year, and whether the team has the money. Nothing reaches the
      register until it is actually handed over.
    handler: gift_requests
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      A limit is annual and so is a budget. The year is what makes "can we
      afford this" and "does this take them over" answerable.

    # Everybody can ask, and sees what they asked for or what is for them.
    # A lead sees their team's. Procurement, Compliance, Finance, Audit and
    # Leadership see the firm, because a request nobody can see is the
    # problem this exists to end.
    visibility:
      firm: [procurement, compliance, finance, audit, leadership]
      team: [manager]
      self: [employee]

    actions:
      - id: approve
        label: Approve
        roles: [manager, compliance]
        confirm: >-
          Lets Procurement buy it and commits the budget. If it takes the
          recipient past the annual limit you will have been told so, and
          the approval records that you knew.
        reversible: false
      - id: decline
        label: Decline
        roles: [manager, compliance]
        note_label: Why are you declining it?
        confirm: >-
          Refuses it, with your reason on the record. Nothing is bought and
          nothing reaches anybody's total.
        reversible: false
      - id: cancel_request
        label: Withdraw it
        roles: [employee]
        confirm: Withdraws your own request. Nothing was bought.
        reversible: false
      - id: mark_purchased
        label: Bought
        roles: [procurement]
        confirm: >-
          Records that this has been purchased. It still does not count
          towards anybody's limit — that happens when it is handed over.
        reversible: false
      - id: mark_given
        label: Handed over
        roles: [procurement]
        confirm: >-
          Puts it on the register against the recipient, from today, and
          asks them to acknowledge it. This is the moment it starts
          counting towards their annual limit.
        reversible: false
        outward: true

    forms:
      - id: request_gift
        label: Ask for a gift
        submit_label: Send the request
        blurb: >-
          Say who it is for and what it is. Before you send it, "What would
          this do?" will tell you whether it is permitted, what it does to
          their year, and whether your team has the money — which is
          cheaper to find out now than after it is bought.
        confirm: >-
          Goes to a manager or compliance to approve, with your name on it.
          Nothing is bought and nothing counts towards anybody's limit
          until somebody approves it and it is handed over.
        fields:
          - id: recipient
            label: Who it is for
            kind: text
            help: Their name, as Compass knows it.
          - id: what
            label: What it is
            kind: text
            help: A hamper, a watch, tickets.
          - id: kind
            label: Type
            kind: choice
            options: [gift, award, voucher, hospitality]
            help: >-
              Gifts, awards and vouchers count towards the recipient's
              annual limit. Hospitality is not requested through this yet.
          - id: occasion
            label: Why
            kind: choice
            options: [festival, long service, performance, client courtesy,
                      farewell, other]
            help: Policy depends on this, so it is not a free-text note.
          - id: value
            label: What it costs
            kind: money
            help: Whole rupees.
          - id: source
            label: Which team is paying
            kind: choice
            options: [Procurement · Chennai, Procurement · Bengaluru,
                      People team, Service line · Advisory,
                      Service line · Tax, Service line · Assurance]
            help: The budget it comes out of.

    rules:
      - id: would_cross_the_limit
        headline: Something here takes somebody past the limit.
        detail: >-
          It can still be approved — this is a decision, not a block. What
          has changed is that whoever approves it knows before they do,
          rather than Finance finding out at the year end.
        tone: limit
      - id: against_policy
        headline: Something here cannot be approved as asked.
        detail: >-
          Policy or budget says no. The request stays on the record with
          its reason; changing what is asked for means a new request.
        tone: limit
      - id: nothing_requested
        headline: Nothing has been asked for yet.
        detail: >-
          Requests raised here are checked before approval and reach
          RewardLens only when they are handed over.
        tone: notice
      - id: not_yours_to_see
        headline: Compass cannot place you.
        detail: >-
          This is read with your own access, and the directory has no
          record of who you are. SCS can link your account.
        tone: limit
      - id: period_closed
        headline: Read-only.
        detail: This year has been signed off. Nothing in it can change.
        tone: limit

    starters:
      - What is waiting for approval?
      - What would take somebody over the limit?

    tools:
      - read_rows
      - explain_row

  - id: rewardlens
    name: RewardLens
    short: Gifts · awards · thresholds
    blurb: >-
      Every gift, award and voucher given to an employee, totalled per person
      against the annual limit. The spend was always known; who received it
      was not.
    handler: rewardlens
    # A limit is annual, so a period is the one thing this is meaningless
    # without. Entity is deliberately absent: one country, one currency, in
    # this phase — the moment that changes the totals stop being comparable
    # and the scope has to say so rather than quietly summing two currencies.
    scope: [period]

    # Who sees how much of it. An employee sees their own year against the
    # limit — a useful screen, and the one the requirement asks for when it
    # says employees declare what they were given. A service line lead sees
    # the people who report to them. Compliance, Finance, Audit and
    # Leadership see the firm, because answering "who received what" across
    # it is the problem this exists to solve.
    visibility:
      firm: [compliance, finance, audit, leadership]
      team: [manager]
      self: [employee]

    # Financial years, not quarters: the limit this screen exists to watch is
    # an annual one, and a quarterly total could not be compared against it.
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The limit is annual, so a year is the one thing a total needs. Pick the
      year and every gift, award and voucher inside it is added up per person.

    actions:
      - id: refer_to_finance
        label: Refer to Finance
        roles: [compliance]
        confirm: >-
          Sends this person's cumulative total and the items behind it to
          Finance to decide the tax treatment. Compass cannot take it back.
        reversible: false
        outward: true
      - id: acknowledge
        label: I received these
        roles: [employee]
        confirm: >-
          Confirms you received what is recorded against you. It does not
          change any figure — it changes the record from something the firm
          says happened to something you have agreed happened.
        reversible: false
      - id: chase_acknowledgement
        label: Chase acknowledgement
        roles: [compliance, procurement]
        confirm: >-
          Asks the recipient to confirm they received the items that are
          still unacknowledged. Can be sent again later.
        reversible: true
        outward: true
      - id: record_exception
        label: Record an exception
        roles: [compliance]
        confirm: >-
          Records that this breach is accepted, with your name against it and
          the reason you give. It stays on the audit trail and does not
          remove the breach.
        reversible: false

      - id: accept_disclosure
        label: Accept as declared
        roles: [compliance]
        confirm: >-
          Records that you reviewed this declaration and it stands as made.
          Your name goes against the decision. It does not change the item,
          its value, or the total it counts towards.
        reversible: false
      - id: query_disclosure
        label: Query it
        roles: [compliance]
        confirm: >-
          Emails the person who declared it the question you give, and
          records that you asked. The record does not change while you wait,
          and it keeps counting towards their limit.
        reversible: true
        outward: true
        note_label: What do you need to ask them?
      - id: accept_answer
        label: Accept the answer
        roles: [compliance]
        confirm: >-
          Settles what you asked. If they said the value was wrong, the
          corrected figure replaces it and the original stays on the record,
          superseded — this is the only way a recorded item stops counting,
          and it takes both of you.
        reversible: false
      - id: resend_notice
        label: Send it again
        roles: [compliance]
        confirm: >-
          Tries the email again. What was asked does not change — only the
          sending of it is retried.
        reversible: true
        outward: true
      - id: record_breach
        label: Not permitted
        roles: [compliance]
        confirm: >-
          Records that what was given was not permitted, with your reason
          against it. It stays on the audit trail and still counts towards
          the total — a breach does not un-receive a gift.
        reversible: false
        note_label: Why was this not permitted?

    forms:
      - id: answer_query
        label: Answer
        on_row: true
        blurb: >-
          Somebody has asked you about this. Say whether it is right as
          declared, what the value should have been, or that you should not
          have declared it. Nothing moves until they accept your answer.
        submit_label: Send the answer
        confirm: >-
          Goes back to the person who asked, with your name on it. Your
          total does not change while they decide, and both what you
          declared and what you say now stay on the record.
        fields:
          - id: response
            label: Which is it
            kind: choice
            options: [stands, corrected, withdrawn]
            help: >-
              stands — it is right as declared. corrected — the value was
              wrong. withdrawn — you should not have declared it, because it
              was a duplicate or you did not receive it.
          - id: value
            label: What it should have been
            kind: money
            required: false
            help: Only with a correction. Leave it empty otherwise.
          - id: note
            label: What you want to tell them
            kind: text
            help: >-
              The reason, in your words. It goes on the record beside what
              you declared.

      - id: disclose
        label: Declare something you were given
        blurb: >-
          Anything you received that did not come through Procurement — a
          hamper from a vendor, a gift at a client site. It is recorded
          against your name and counts towards your annual limit from the
          moment you record it, not from when somebody reviews it.
        submit_label: Record it
        confirm: >-
          Records this against your own name. It cannot be edited or
          withdrawn afterwards, because the point of the record is that it
          did not change after the fact.
        fields:
          - id: what
            label: What it was
            kind: text
            help: A hamper, a watch, tickets. Enough for somebody to recognise it.
          - id: kind
            label: Type
            kind: choice
            options: [gift, award, voucher, hospitality]
            help: >-
              Gifts, awards and vouchers count towards the limit. Hospitality
              is recorded now and added to the total in a later phase.
          - id: value
            label: What it was worth
            kind: money
            help: >-
              Whole rupees. Your best estimate is fine — an estimate on the
              record is worth more than an exact figure that is not.
          - id: given
            label: When you received it
            kind: date
            help: It counts towards the year it was received in.
          - id: source
            label: Who gave it to you
            kind: text
            help: The vendor, client or team. Not the person who handed it over.

    rules:
      - id: over_limit
        headline: Someone is over the annual limit.
        detail: >-
          Finance decides the tax treatment, not this screen. What this screen
          does is make sure the total is known and the referral is recorded.
        tone: limit
      - id: you_are_a_recipient
        headline: You are in this list.
        detail: >-
          You received items in this period, so your own row is shown but you
          cannot act on it. Another reviewer has to — a person clearing their
          own breach is the thing an audit trail exists to catch.
        tone: limit
      - id: disclosures_waiting
        headline: Self-disclosed items are waiting.
        detail: >-
          Someone declared something they were given outside the standard
          process. It counts towards their limit from the moment it is
          recorded, not from when it is reviewed.
        tone: notice
      - id: notices_not_sent
        headline: Somebody was not told.
        detail: >-
          A question was recorded but the email did not go — no address on
          file, or no mail server configured. The question stands and the
          item keeps counting; the person simply does not know yet.
        tone: limit
      - id: review_is_a_role
        headline: You can see these, not decide them.
        detail: >-
          Reviewing a declaration is a compliance role. The declarations are
          shown because knowing what the firm received is not restricted;
          deciding them is.
        tone: notice
      - id: your_own_record
        headline: This is your year, and nobody else's.
        detail: >-
          Everything recorded against your name, totalled against the annual
          limit. Colleagues' records are not shown to you, and yours is not
          shown to them — only to the people who have to answer for the
          firm's position.
        tone: notice
      - id: you_are_over
        headline: You are past the annual limit.
        detail: >-
          Declaring what you received was the right thing. Finance decides
          whether there is a tax consequence; nothing here is a finding
          against you, and the figure is the sum of what is recorded.
        tone: limit
      - id: not_yours_to_see
        headline: Compass cannot place you.
        detail: >-
          This screen is read with your own access, and the directory has no
          record of who you are — so there is nothing it can show you rather
          than somebody else's. SCS can link your account.
        tone: limit
      - id: period_closed
        headline: Read-only.
        detail: This year has been signed off. Nothing in it can change.
        tone: limit

    starters:
      - Who is over the limit?
      - Why is John over?
      - What has nobody acknowledged?
      - What is waiting to be reviewed?
      - Refer John to Finance

    tools:
      - read_rows
      - explain_row

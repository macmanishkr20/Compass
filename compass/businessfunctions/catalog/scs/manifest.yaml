# Supply Chain Services.
#
# THREE LEVELS, because the firm has three. SCS is the FUNCTION: the part of
# the firm that buys and distributes things on everybody's behalf.
# RewardLens is a SERVICE it runs — everything the firm gives an employee —
# and the screens below are that service's SUB-SERVICES, a desk each in one
# process.
#
# Flattened to two levels the sub-services sat beside each other looking like
# five separate services, which is what somebody reading the nav concluded.

id: scs
name: SCS
subtitle: Supply Chain Services
blurb: >-
  Procurement and distribution. SCS runs RewardLens, the service that covers
  everything the firm gives an employee: a request is asked for, checked by
  each desk in turn, bought, handed over and confirmed by the person who
  received it, and the tracker is what it all adds up to against the annual
  limit.
owner: scs-function-owner

services:
  - id: rewardlens
    name: RewardLens
    short: Gifts, awards and vouchers
    blurb: >-
      One service for everything the firm gives an employee. Anybody may ask
      for a gift; each desk checks what it is theirs to check; the tracker
      follows the order and what it came to. The Dashboard is leadership's
      only view of the whole position.

starters:
  - Who is over the gift limit this year?
  - Where has something been stuck longest?
  - Which orders went out this year?

tools:
  - read_rows
  - explain_row

features:
  - id: oversight
    service: rewardlens
    name: Dashboard
    short: The whole position, for leadership
    blurb: >-
      THE leadership view, and the only one: what the firm is exposed to,
      how much of it nobody has decided, and where the process has stopped.
      Built from the same rows the register shows, so the two cannot
      disagree. Everything else here is a desk doing work; this is the one
      screen for reading the position rather than acting on it.
    handler: gift_oversight
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      Exposure is a figure for one year. Picking the year is what makes it
      a number rather than a pile.

    # No `self` and no `team`: an aggregate of one person is not a
    # dashboard, and "what is the firm exposed to" is not a question an
    # individual's own record can answer. Everybody else is told why rather
    # than shown an empty screen.
    # LEADERSHIP ONLY. The one view of the whole position, and the only
    # screen here that is for reading rather than doing. Finance and
    # Payroll have their own screens; giving them this one as well made it
    # a third opinion about the same facts.
    visibility:
      firm: [leadership]

    # No actions, deliberately. This screen reports; the decisions belong
    # to the people whose names go against them, on RewardLens. A feature
    # with no actions also tells the assistant it cannot operate here, so
    # the rail answers questions and never proposes anything.

    rules:
      - id: oversight_is_a_role
        headline: This one is for compliance.
        detail: >-
          It names people and what they received across the whole firm, so
          it is shown to the compliance role. That the screen exists is not
          the secret; what is on it is.
        tone: limit
      - id: somebody_never_heard
        headline: A question never reached the person it was about.
        detail: >-
          The record says it was asked and the email did not go. Nobody is
          waiting on them, because they do not know they were asked — which
          is the quietest way for this to fail.
        tone: limit
      - id: the_process_has_stalled
        headline: Something has been waiting too long.
        detail: >-
          Not a breach — a process that stopped. Whoever was supposed to
          answer has not, and no amount of chasing the totals will fix
          that.
        tone: limit
      - id: nothing_outstanding
        headline: Nothing is waiting on anybody.
        detail: >-
          Every breach has been decided and every question answered. Worth
          saying out loud: a dashboard that only speaks when things are
          wrong is one people learn to ignore.
        tone: notice

    starters:
      - What are we exposed to?
      - What has nobody decided?
      - Where has the process stopped?

    tools:
      - read_rows
      - explain_row

  - id: requests
    service: rewardlens
    name: Gift requests
    short: Ask · check · sign off · give
    blurb: >-
      The chain, from asking to closing. A request sits with exactly one
      team at a time — Service Line, Finance, Procurement, then
      Operations and the requester to allocate and hand over, and each
      recipient to confirm what they were given. Neither Payroll nor
      Accounts Payable is a step: nothing here raises, orders or pays for
      anything, and what is taxable is a property of somebody's year
      rather than of a purchase, so it is read on Tax & budget.
    handler: gift_requests
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The allowance is annual, so the year is what makes "does this take
      them over" answerable.

    # Cut on the day the gifts actually went out — not when the order was
    # asked for, approved or bought, which can be months earlier.
    date_range: distributed on

    # Everybody can raise one and sees what they raised or what is for them.
    # A service line lead sees their team's. The teams in the chain see the
    # firm, because a request nobody can find is the problem this ends.
    visibility:
      firm: [requester, service_line, finance, payroll, procurement,
             accounts_payable, operations, compliance, leadership]
      team: [service_line]
      self: [employee]

    actions:
      - id: sign_off
        label: Sign off
        roles: [service_line, finance, procurement, operations, requester,
                employee]
        note_label: What did you check?
        confirm: >-
          Signs off this stage with your name against it and moves the
          request to the next team. Finance must say what they
          checked; closing the recipient list settles who is getting one
          and is what the firm treats as the acknowledgement; and starting
          the distribution puts it on the register, emails every recipient
          and finishes the order.
        reversible: false
      # The three desks whose step is a CHECK. Not Operations and not the
      # recipient: by the time it reaches them it has been approved, bought
      # and paid for, and their job is to record what happened rather than
      # to reopen a decision five other desks already took.
      - id: decline
        label: Send it back
        roles: [service_line, finance, procurement]
        note_label: Why are you sending it back?
        confirm: >-
          Stops it here, with your reason on the record. Nothing is bought
          and nothing reaches anybody's total.
        reversible: false
      - id: cancel_request
        label: Withdraw it
        roles: [employee]
        confirm: >-
          Withdraws your own request, while it is still being checked.
          Nothing was bought.
        reversible: false
      - id: request_exception
        label: Ask Finance for an exception
        roles: [service_line, finance, procurement, operations, requester,
                employee]
        note_label: Why should this go ahead anyway?
        confirm: >-
          Asks Finance to take responsibility for a gift the rules refuse.
          It does not approve anything and it does not move the order —
          it puts the question, and your reason, on the record.
        reversible: true
      - id: grant_exception
        label: Grant the exception
        roles: [finance]
        note_label: Why are you allowing it?
        confirm: >-
          Records that you are allowing a gift the rules refuse, in your
          name and with your reason. The rule stays on the record beside
          your decision — an exception does not rewrite the policy, it
          says who took responsibility for going past it.
        reversible: false
      - id: refuse_exception
        label: Refuse the exception
        roles: [finance]
        note_label: Why not?
        confirm: >-
          Records that the rule stands. The order stays blocked and
          whoever is holding it can send it back.
        reversible: false

    forms:
      - id: request_gift
        label: Ask for a gift
        submit_label: Send the request
        blurb: >-
          Say what it is, how many, and who it is for if you know yet.
          Before you send it, "What would this do?" will tell you whether
          it is permitted and what it does to their year — which is cheaper
          to find out now than after it is bought.
        confirm: >-
          Starts the chain with your name on it: the Service Line
          Approver first, then Finance, then Procurement. Nothing counts
          towards anybody's limit until it is actually allocated and
          handed over.
        fields:
          # Read in the order somebody thinks in: what, how many, what it
          # costs, why, and only then who. Who comes last because for a
          # bulk order it is the one nobody can answer yet.
          - id: what
            label: What it is
            kind: text
            help: A hamper, a watch, tickets.
          - id: kind
            label: Type
            kind: choice
            options: [gift, award, voucher, hospitality]
            help: >-
              Gifts, awards and vouchers count towards the recipient's
              annual limit. Hospitality is not requested through this yet.
          - id: quantity
            label: How many
            kind: count
            help: >-
              Required. Procurement orders this many from the vendor, in
              their own system, so a number nobody gave is a number
              somebody has to go and ask for.
          - id: value
            label: What ONE costs
            kind: money
            help: Whole rupees. A single gift, not the order.
          - id: occasion
            label: Why
            kind: choice
            options: [festival, long service, performance, client courtesy,
                      farewell, other]
            help: Policy depends on this, so it is not a free-text note.
          - id: purpose
            label: What it is for
            kind: text
            help: >-
              The business reason, in your words. The occasion is the
              category policy reads; this is what an approver decides on.
          - id: recipient
            label: Who it is for
            required: false
            help: >-
              One name, or several separated by commas. Leave it empty if
              you do not know yet — they are named at distribution.
          - id: recipient_list
            label: Or upload the recipient list
            kind: names
            required: false
            # BOTH DESKS THAT HOLD A LIST. The Service Line Approver has it
            # when the order is raised; Operations have it when the order
            # reaches them, and they are the desk that closes it. Gated on
            # the service line alone, an Operations SPOC raising a bulk
            # order had to type two hundred names in by hand next to an
            # upload box they could not see.
            roles: [service_line, operations]
            help: >-
              A spreadsheet, or names pasted a line at a time. Compass
              reads the first column of the first sheet and shows you who
              it found before anything is sent. The firm buys two hundred
              hampers at a time, and whoever is holding that list — the
              Service Line Approver or the Operations SPOC — can put it
              here.

      - &chain_link_purchase
        id: link_purchase
        label: Link the PR/PO
        on_row: true
        submit_label: Link it
        confirm: >-
          Writes the purchasing system's own numbers onto this order's
          trail, in your name. It changes nothing in that system: Compass
          does not raise, approve, amend or pay anything, and nothing is
          read back.
        blurb: >-
          The thread back to the system that bought it. Write the
          requisition's own numbers down here and a register record leads
          to a gift, which leads to an order, which leads to the purchase
          that paid for it. Quote this order's id on the requisition;
          Compass issues no number of its own.
        fields:
          - id: pr
            label: Requisition (PR)
            kind: text
            required: false
          - id: po
            label: Purchase order (PO)
            kind: text
            required: false
          - id: grn
            label: GRN
            kind: text
            required: false

      - &chain_revise_list
        id: revise_list
        label: Change the recipient list
        on_row: true
        submit_label: Change the list
        blurb: >-
          Controlled add and remove, before anything reaches the register.
          Names come off by being recorded as coming off, with your reason
          — the list as first approved stays on the trail beside every
          revision, because "it was right first time" and "it was changed
          twice" are different facts.
        confirm: >-
          Puts each change on this order's trail in your name. It cannot
          take the list past the quantity that was approved, and it cannot
          touch anything already on the register.
        fields:
          - id: add
            label: Put on the list
            kind: text
            required: false
            help: Names separated by commas.
          - id: remove
            label: Take off the list
            kind: text
            required: false
            help: Names separated by commas.
          - id: why
            label: Why it changed
            kind: text
            help: >-
              Somebody left, somebody was missed, the event changed. One
              line is enough; nothing is enough.

    rules:
      - id: waiting_on_you
        headline: Something is waiting on you.
        detail: >-
          These are at a stage your team owns. Nobody else can move them
          along, and nothing behind them moves until they do.
        tone: limit
      - id: would_cross_the_limit
        headline: Something here takes somebody past the limit.
        detail: >-
          It can still be signed off — this is a decision, not a block.
          What has changed is that whoever signs it knows before they do,
          rather than Finance finding out at the year end.
        tone: limit
      - id: against_policy
        headline: Something here cannot proceed as asked.
        detail: >-
          Policy says no. The request stays on the record with
          its reason; changing what is asked for means a new request.
        tone: limit
      - id: nothing_requested
        headline: Nothing has been asked for yet.
        detail: >-
          Requests raised here are checked by each team in turn and reach
          RewardLens only when they are handed over.
        tone: notice
      - id: not_yours_to_see
        headline: Compass cannot place you.
        detail: >-
          This is read with your own access, and the directory has no
          record of who you are. SCS can link your account.
        tone: limit
      - id: period_closed
        headline: Read-only.
        detail: This year has been signed off. Nothing in it can change.
        tone: limit

    starters:
      - What is waiting on me?
      - What would take somebody over the limit?
      - Where has something been stuck longest?

    tools:
      - read_rows
      - explain_row

  - id: register
    service: rewardlens
    name: Tracker
    short: What was given, and to whom
    blurb: >-
      Every gift, award and voucher given to an employee, totalled per person
      against the annual limit. The spend was always known; who received it
      was not.
    handler: rewardlens
    # A limit is annual, so a period is the one thing this is meaningless
    # without. Entity is deliberately absent: one country, one currency, in
    # this phase — the moment that changes the totals stop being comparable
    # and the scope has to say so rather than quietly summing two currencies.
    scope: [period]

    # Who sees how much of it. An employee sees their own year against the
    # limit — a useful screen, and the one the requirement asks for when it
    # says employees declare what they were given. A service line lead sees
    # the people who report to them. Compliance, Finance, Audit and
    # Leadership see the firm, because answering "who received what" across
    # it is the problem this exists to solve.
    # Everybody who HANDLES an order can read what happened to it:
    # admin, Procurement, Payroll, Accounts Payable and the compliance
    # side. A history only its subjects cannot read is not much of a
    # control.
    visibility:
      firm: [compliance, finance, payroll, operations, leadership]
      team: [service_line]
      self: [employee]

    # Financial years, not quarters: the limit this screen exists to watch is
    # an annual one, and a quarterly total could not be compared against it.
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The limit is annual, so a year is the one thing a total needs. Pick the
      year and every gift, award and voucher inside it is added up per person.

    actions:
      # The chain, signed off from here. Every persona but the requester
      # and the recipient works on this screen: Gift requests is where
      # somebody ASKS, the Tracker is where the desks DECIDE. The ids and
      # the roles are the chain's own — the handler hands the action
      # straight back to it rather than keeping a second copy of the
      # rules — and `register` declaring them is what lets its role gate
      # answer for them at all.
      - id: sign_off
        label: Sign off
        roles: [service_line, finance, procurement, operations, requester,
                employee]
        note_label: What did you check?
        confirm: >-
          Signs off this stage with your name against it and moves the
          order to the next team. Finance must say what they
          checked; closing the recipient list settles who is getting one
          and is what the firm treats as the acknowledgement; and starting
          the distribution puts it on the register, emails every recipient
          and finishes the order.
        reversible: false
      - id: decline
        label: Send it back
        roles: [service_line, finance, procurement]
        note_label: Why are you sending it back?
        confirm: >-
          Stops it here, with your reason on the record. Nothing is bought
          and nothing reaches anybody's total.
        reversible: false
      - id: cancel_request
        label: Withdraw it
        roles: [employee]
        confirm: >-
          Withdraws your own order, while it is still being checked.
          Nothing was bought.
        reversible: false
      - id: request_exception
        label: Ask Finance for an exception
        roles: [service_line, finance, procurement, operations, requester,
                employee]
        note_label: Why should this go ahead anyway?
        confirm: >-
          Asks Finance to take responsibility for a gift the rules refuse.
          It does not approve anything and it does not move the order —
          it puts the question, and your reason, on the record.
        reversible: true
      - id: grant_exception
        label: Grant the exception
        roles: [finance]
        note_label: Why are you allowing it?
        confirm: >-
          Records that you are allowing a gift the rules refuse, in your
          name and with your reason. The rule stays on the record beside
          your decision — an exception does not rewrite the policy, it
          says who took responsibility for going past it.
        reversible: false
      - id: refuse_exception
        label: Refuse the exception
        roles: [finance]
        note_label: Why not?
        confirm: >-
          Records that the rule stands. The order stays blocked and
          whoever is holding it can send it back.
        reversible: false

      - id: refer_to_finance
        label: Refer to Finance
        roles: [compliance]
        confirm: >-
          Sends this person's cumulative total and the items behind it to
          Finance to decide the tax treatment. Compass cannot take it back.
        reversible: false
        outward: true
      - id: record_exception
        label: Record an exception
        roles: [compliance]
        confirm: >-
          Records that this breach is accepted, with your name against it and
          the reason you give. It stays on the audit trail and does not
          remove the breach.
        reversible: false

      - id: accept_disclosure
        label: Accept as declared
        roles: [compliance]
        confirm: >-
          Records that you reviewed this declaration and it stands as made.
          Your name goes against the decision. It does not change the item,
          its value, or the total it counts towards.
        reversible: false
      - id: query_disclosure
        label: Query it
        roles: [compliance]
        confirm: >-
          Emails the person who declared it the question you give, and
          records that you asked. The record does not change while you wait,
          and it keeps counting towards their limit.
        reversible: true
        outward: true
        note_label: What do you need to ask them?
      - id: accept_answer
        label: Accept the answer
        roles: [compliance]
        confirm: >-
          Settles what you asked. If they said the value was wrong, the
          corrected figure replaces it and the original stays on the record,
          superseded — this is the only way a recorded item stops counting,
          and it takes both of you.
        reversible: false
      - id: resend_notice
        label: Send it again
        roles: [compliance]
        confirm: >-
          Tries the email again. What was asked does not change — only the
          sending of it is retried.
        reversible: true
        outward: true
      - id: record_breach
        label: Not permitted
        roles: [compliance]
        confirm: >-
          Records that what was given was not permitted, with your reason
          against it. It stays on the audit trail and still counts towards
          the total — a breach does not un-receive a gift.
        reversible: false
        note_label: Why was this not permitted?

    forms:
      # THE CHAIN'S OWN FORMS, aliased rather than copied. Every persona
      # but the raiser signs an order off HERE, so the two forms the
      # distribution step needs have to be openable here — and a second
      # copy of their words in this file would be two vocabularies for one
      # form, which is the failure the manifest exists to prevent. The
      # handler delegates them to Gift requests exactly as it already
      # delegates the chain's actions: the Tracker is where the buttons
      # are; Gift requests is still where the rules are.
      - *chain_revise_list
      - *chain_link_purchase
      - id: answer_query
        label: Answer
        on_row: true
        blurb: >-
          Somebody has asked you about this. Say whether it is right as
          declared, what the value should have been, or that you should not
          have declared it. Nothing moves until they accept your answer.
        submit_label: Send the answer
        confirm: >-
          Goes back to the person who asked, with your name on it. Your
          total does not change while they decide, and both what you
          declared and what you say now stay on the record.
        fields:
          - id: response
            label: Which is it
            kind: choice
            options: [stands, corrected, withdrawn]
            help: >-
              stands — it is right as declared. corrected — the value was
              wrong. withdrawn — you should not have declared it, because it
              was a duplicate or you did not receive it.
          - id: value
            label: What it should have been
            kind: money
            required: false
            help: Only with a correction. Leave it empty otherwise.
          - id: note
            label: What you want to tell them
            kind: text
            help: >-
              The reason, in your words. It goes on the record beside what
              you declared.

      - id: disclose
        label: Declare something you were given
        blurb: >-
          Anything you received that did not come through Procurement — a
          hamper from a vendor, a gift at a client site. It is recorded
          against your name and counts towards your annual limit from the
          moment you record it, not from when somebody reviews it.
        submit_label: Record it
        confirm: >-
          Records this against your own name. It cannot be edited or
          withdrawn afterwards, because the point of the record is that it
          did not change after the fact.
        fields:
          - id: what
            label: What it was
            kind: text
            help: A hamper, a watch, tickets. Enough for somebody to recognise it.
          - id: kind
            label: Type
            kind: choice
            options: [gift, award, voucher, hospitality]
            help: >-
              Gifts, awards and vouchers count towards the limit. Hospitality
              is recorded now and added to the total in a later phase.
          - id: value
            label: What it was worth
            kind: money
            help: >-
              Whole rupees. Your best estimate is fine — an estimate on the
              record is worth more than an exact figure that is not.
          - id: given
            label: When you received it
            kind: date
            help: It counts towards the year it was received in.
          - id: source
            label: Who gave it to you
            kind: text
            help: The vendor, client or team. Not the person who handed it over.

    rules:
      - id: over_limit
        headline: Someone is over the annual limit.
        detail: >-
          Finance decides the tax treatment, not this screen. What this screen
          does is make sure the total is known and the referral is recorded.
        tone: limit
      - id: you_are_a_recipient
        headline: You are in this list.
        detail: >-
          You received items in this period, so your own row is shown but you
          cannot act on it. Another reviewer has to — a person clearing their
          own breach is the thing an audit trail exists to catch.
        tone: limit
      - id: disclosures_waiting
        headline: Self-disclosed items are waiting.
        detail: >-
          Someone declared something they were given outside the standard
          process. It counts towards their limit from the moment it is
          recorded, not from when it is reviewed.
        tone: notice
      - id: notices_not_sent
        headline: Somebody was not told.
        detail: >-
          A question was recorded but the email did not go — no address on
          file, or no mail server configured. The question stands and the
          item keeps counting; the person simply does not know yet.
        tone: limit
      - id: review_is_a_role
        headline: You can see these, not decide them.
        detail: >-
          Reviewing a declaration is a compliance role. The declarations are
          shown because knowing what the firm received is not restricted;
          deciding them is.
        tone: notice
      - id: your_own_record
        headline: This is your year, and nobody else's.
        detail: >-
          Everything recorded against your name, totalled against the annual
          limit. Colleagues' records are not shown to you, and yours is not
          shown to them — only to the people who have to answer for the
          firm's position.
        tone: notice
      - id: you_are_over
        headline: You are past the annual limit.
        detail: >-
          Declaring what you received was the right thing. Finance decides
          whether there is a tax consequence; nothing here is a finding
          against you, and the figure is the sum of what is recorded.
        tone: limit
      - id: not_yours_to_see
        headline: Compass cannot place you.
        detail: >-
          This screen is read with your own access, and the directory has no
          record of who you are — so there is nothing it can show you rather
          than somebody else's. SCS can link your account.
        tone: limit
      - id: period_closed
        headline: Read-only.
        detail: This year has been signed off. Nothing in it can change.
        tone: limit

    starters:
      - Who is over the limit?
      - Why is John over?
      - What is waiting to be reviewed?
      - Refer John to Finance

    tools:
      - read_rows
      - explain_row
  - id: finance
    service: rewardlens
    name: Tax & budget
    short: Referrals · thresholds · spend
    blurb: >-
      What compliance has sent to Finance, who is past the annual limit and
      by how much, who the tax teams need to be told about, and the
      threshold itself with every version it has had. It reports; it does
      not assess — GST, perquisite and personal tax are the tax teams'
      own, in their own systems.
      One allowance, the same for every employee whatever team they are in,
      because one team buys for the whole firm. The amount above the limit
      is reported; the tax treatment is Finance's own system's to decide.
    handler: gift_finance
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The allowance is annual. Without the year, "who is past it" has no
      answer.

    visibility:
      firm: [finance, payroll, compliance, leadership]

    actions:
      - id: record_tax
        label: Record the treatment
        roles: [finance]
        note_label: What did Finance do with it?
        confirm: >-
          Records that Finance has dealt with this referral, with your note
          on the trail. It does not change the total — a total is the sum of
          what somebody received, and no department edits that.
        reversible: false

    rules:
      - id: finance_is_a_role
        headline: This one is for Finance.
        detail: >-
          It names everybody past the annual limit across the firm, which is
          not something an individual needs to read.
        tone: limit
      - id: not_everything_was_referred
        headline: Somebody is past the limit and was never referred.
        detail: >-
          Finance hearing only about the breaches compliance remembered to
          send is the shape of the problem this function exists to end, so
          the list here is everybody — referred or not.
        tone: limit
      - id: nothing_above_the_limit
        headline: Nobody is past the limit.
        detail: Worth saying plainly, so the screen is read when it is not.
        tone: notice

    starters:
      - Who is past the limit?
      - What has been referred to Finance?
      - What is the allowance, and when did it change?
      - Who has crossed the threshold this year?

    forms:
      - id: set_thresholds
        label: Set thresholds
        submit_label: Put it in force
        blurb: >-
          The cumulative annual limit and the per-gift tax-free limit every
          request is judged against. Leave a field empty to keep it as it
          is. "What would this do?" shows the change before anything moves.
        confirm: >-
          Puts a NEW VERSION in force from this moment. Nothing already
          recorded changes: a gift inside the limit on the day it was given
          stays inside it, and a breach stays a breach. The change goes on
          the audit trail with your name and your reason.
        fields:
          - id: annual_limit
            label: Cumulative annual limit per person
            kind: money
            required: false
            help: >-
              Every gift in the year added together. Past this, an order
              needs either a sign-off made knowingly or an exception
              somebody puts their name to — and compliance is told the day
              it crosses.
          - id: big
            label: Tax-free limit per gift
            kind: money
            required: false
            help: >-
              At or below this, a gift is tax-free. Above it, the gift is
              taxable and is marked as such — what that means for the
              recipient is the tax teams' own work, offline. Not a gate:
              nothing is refused or re-routed for being above it.
          - id: why
            label: Why are you changing it?
            kind: text
            help: >-
              Goes on the trail against the version. A threshold moved with
              no reason is one nobody can account for later.

    tools:
      - read_rows
      - explain_row

  - id: audit
    service: rewardlens
    name: Audit trail
    short: Every order, end to end
    blurb: >-
      Not a position but a history. One row per ORDER, by its number, from
      the day it was asked for to the day the recipient confirmed receiving
      it — open one and its whole trail is there, every step with a name
      and a time against it. The raw list of events is still underneath,
      because the question this answers is whether every gift and every
      approval can be shown to have happened, which no summary can.
    handler: gift_audit
    scope: [period]
    choices:
      period: [FY 2026-27, FY 2025-26, FY 2024-25]
    scope_why: >-
      The trail is kept per year, like everything else that hangs off an
      annual limit.

    # No actions at all. A function that could alter what it audits is not
    # one — and Audit, which can see everything, is the persona most likely
    # to be over-granted by somebody being helpful.

    # Everybody who HANDLES an order can read what happened to it: admin,
    # Procurement, Payroll, Accounts Payable and the compliance side. A
    # history its own subjects cannot read is not much of a control.
    visibility:
      firm: [admin, procurement, payroll, accounts_payable, operations,
             finance, compliance, leadership]

    rules:
      - id: audit_is_a_role
        headline: This one is for Leadership and Compliance.
        detail: >-
          It shows every decision anybody has taken about anybody's gifts,
          which is more than most people have any reason to read. Audit is
          not a separate login here — auditing the chain is part of what
          Leadership and Compliance do with it.
        tone: limit
      - id: nothing_has_happened
        headline: Nothing has been recorded yet.
        detail: >-
          No gift has been requested, reviewed or declared in this year. An
          empty trail is a true answer, not a broken screen.
        tone: notice

    starters:
      - What happened most recently?
      - Which decisions has anybody taken?

    tools:
      - read_rows
      - explain_row


# The Tax service line.
#
# Everything below is read by compass/servicelines/registry.py and checked
# against the rules in manifest.py. If a rule is broken this file does not
# load at all — half of a service line is worse than none.
#
# The four `governance` answers are the ones that matter. They are carried
# onto every engagement opened under Tax, and nothing opens until all four
# are answered.

id: tax
name: Tax
description: >-
  Direct and indirect tax delivery. Returns, reconciliations and notice
  responses, prepared for review by a tax professional.
lead_prompt: prompts/lead.md
owner: tax-service-line-owner

governance:
  classification: client-confidential
  residency: india-south
  # Statutory retention for tax working papers. Longer than Compass's own
  # audit rows, which is the direction this is allowed to move.
  retention_months: 96
  reviewer: engagement-partner

# The ceiling for every skill below. A skill may ask for fewer of these and
# never for more, and the names withheld firm-wide (shell, filesystem, web)
# cannot appear here at all.
tools:
  - doc_read
  - doc_classify
  - extract_field

skills:
  - id: form26_prefill
    name: Form 26 Prefill
    description: >-
      Fills the annual TDS return from challans, the contractor ledger and
      Form 16A. Every field carries the document and page it came from.
    prompt: prompts/form26_prefill.md
    version: 1.3.0
    status: approved
    output:
      kind: form
      form: forms/form-26.yaml
      # Rule 37 was omitted by Notification 178/2005 and the live obligation
      # is the quarterly Form 26Q. This skill is kept for restatements of
      # historical periods, and the UI carries the warning on every run.
      status: superseded
      superseded_by: form-26q
    sources:
      - challan
      - ledger_extract
      - form_16a
    tools:
      - doc_read
      - doc_classify
      - extract_field

  - id: tds_reconciliation
    name: TDS Reconciliation
    description: >-
      Ties the books to Form 26AS and the challan register, and lists every
      difference with the evidence behind it.
    prompt: prompts/tds_reconciliation.md
    version: 2.0.4
    status: approved
    output:
      kind: note
      schema: reconciliation
    sources:
      - ledger_extract
      - form_26as
      - challan
    tools:
      - doc_read
      - extract_field

  - id: notice_response
    name: Notice Response Draft
    description: >-
      Reads a section 143(1) or 139(9) notice and drafts a reply against the
      return already filed. A draft for a person to edit, never a filing.
    prompt: prompts/notice_response.md
    version: 1.1.0
    status: approved
    output:
      kind: document
      schema: letter
    sources:
      - notice
      - prior_return
    tools:
      - doc_read

  - id: form15ca_15cb
    name: 15CA / 15CB Drafting
    description: >-
      Drafts the remittance certificate pair from the invoice, the agreement
      and the treaty position taken.
    prompt: prompts/form15ca_15cb.md
    version: 0.2.0
    # Draft: written, not yet approved by the service-line owner, and so it
    # cannot run. This is the state the approvals screen acts on.
    status: draft
    output:
      kind: form
      form: forms/form-15ca.yaml
    sources:
      - invoice
      - agreement
    tools:
      - doc_read
      - extract_field

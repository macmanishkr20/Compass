# The Talent service line.
#
# The same four governance questions as Tax, and four different answers. That
# difference is the whole argument for manifests: nothing in the code knows
# that Talent keeps data for two years and Tax for eight.

id: talent
name: Talent
description: >-
  Job architecture, assessment design and workforce analytics. Advice for a
  client to act on, never a filing.
lead_prompt: prompts/lead.md
owner: talent-service-line-owner

governance:
  classification: personal-data
  # Not india-south. Personal data stays in the region the workforce is in,
  # which is a property of the engagement's client, not of the firm.
  residency: workforce-region
  # Two years, not eight. Personal data is not kept because it might one day
  # be useful.
  retention_months: 24
  reviewer: engagement-manager

tools:
  - doc_read
  - doc_classify
  - extract_field

skills:
  - id: jd_competency_map
    name: JD to Competency Map
    description: >-
      Maps a job description onto the client's own competency framework, with
      the evidence line behind each level assigned.
    prompt: prompts/jd_competency_map.md
    version: 1.4.1
    status: approved
    output:
      kind: document
      schema: competency_map
    sources:
      - job_description
      - competency_framework
    tools:
      - doc_read
      - extract_field

  - id: interview_kit
    name: Interview Kit Builder
    description: >-
      Builds a structured interview guide and scoring rubric from a
      competency map.
    prompt: prompts/interview_kit.md
    version: 1.0.2
    status: approved
    output:
      kind: document
      schema: interview_kit
    sources:
      - competency_map
    tools:
      - doc_read

  - id: attrition_brief
    name: Attrition Risk Brief
    description: >-
      Summarises the drivers of attrition in a population from survey and
      HRIS extracts. Writes about groups, never about a named person.
    prompt: prompts/attrition_brief.md
    version: 1.0.0
    status: approved
    output:
      kind: note
      schema: brief
      # Talent's own rule, which Tax has no equivalent of. Enforced by the
      # skill's prompt and by the output schema; recorded here so the admin
      # screen can show it without reading the prompt.
      population_only: true
    sources:
      - survey_extract
      - hris_extract
    tools:
      - doc_read
      - extract_field

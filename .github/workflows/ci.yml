name: CI — Build and Artifacts

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/**
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test (mock model)
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke.py 2>&1 | tee smoke.log

      - name: Upload smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          retention-days: 7

      - name: Upload transcripts (local JSONL)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: data/sessions/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload tool result spills (if any)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tool-results
          path: data/tool_results/**
          if-no-files-found: warn
          retention-days: 7
